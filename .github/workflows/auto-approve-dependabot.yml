name: Test, approve, and merge Dependabot updates

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions: {}

# Serialize dependency testing, base updates, version allocation, and tagging.
concurrency:
  group: dependabot-test-merge-and-tag
  cancel-in-progress: false

jobs:
  test-dependabot:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.triggering_actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    env:
      TESTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      TESTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate merge candidate
        shell: bash
        run: |
          for sha in "$TESTED_MERGE_SHA" "$TESTED_BASE_SHA" "$TESTED_HEAD_SHA"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid pull request commit SHA" >&2
              exit 1
            fi
          done

          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          if [[ "$commit" != "$TESTED_MERGE_SHA" || "$first_parent" != "$TESTED_BASE_SHA" || "$second_parent" != "$TESTED_HEAD_SHA" || -n "$extra" ]]; then
            echo "Checked-out commit is not the expected two-parent merge candidate" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  merge-tag-dispatch:
    needs: test-dependabot
    if: >-
      needs.test-dependabot.result == 'success' &&
      github.actor == 'dependabot[bot]' &&
      github.triggering_actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TESTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      TESTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_QUERY: >-
        query($owner: String!, $name: String!, $number: Int!) {
          repository(owner: $owner, name: $name) {
            pullRequest(number: $number) {
              author { login }
              state
              headRefOid
              baseRefOid
              baseRefName
              repository { nameWithOwner }
            }
          }
        }
    steps:
      - name: Revalidate tested Dependabot PR
        shell: bash
        run: |
          for sha in "$TESTED_MERGE_SHA" "$TESTED_BASE_SHA" "$TESTED_HEAD_SHA"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid pull request commit SHA" >&2
              exit 1
            fi
          done
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number" >&2
            exit 1
          fi

          repo_owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          pr_json="$(gh api graphql \
            -F owner="$repo_owner" \
            -F name="$repo_name" \
            -F number="$PR_NUMBER" \
            -f query="$PR_QUERY")"
          author="$(jq -r '.data.repository.pullRequest.author.login' <<<"$pr_json")"
          state="$(jq -r '.data.repository.pullRequest.state' <<<"$pr_json")"
          current_head="$(jq -r '.data.repository.pullRequest.headRefOid' <<<"$pr_json")"
          current_base="$(jq -r '.data.repository.pullRequest.baseRefOid' <<<"$pr_json")"
          base_ref="$(jq -r '.data.repository.pullRequest.baseRefName' <<<"$pr_json")"
          base_repository="$(jq -r '.data.repository.pullRequest.repository.nameWithOwner' <<<"$pr_json")"
          if [[ "$author" != 'dependabot[bot]' || "$state" != 'OPEN' || "$current_head" != "$TESTED_HEAD_SHA" || "$current_base" != "$TESTED_BASE_SHA" || "$base_ref" != 'master' || "$base_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "Pull request no longer matches the tested Dependabot merge candidate" >&2
            exit 1
          fi

          files_json="$(gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"
          if ! jq -e '
            [.[][]] as $files |
            ($files | length) > 0 and
            all($files[];
              . as $file |
              (["go.mod", "go.sum"] | index($file.filename)) != null and
              ($file.status == "modified" or $file.status == "added") and
              ($file | has("previous_filename") | not)
            )
          ' <<<"$files_json" >/dev/null; then
            echo "Dependabot pull request changed a disallowed path or file status" >&2
            exit 1
          fi

          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve

      - name: Check out trusted base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Publish tested merge and release tag
        shell: bash
        run: |
          trusted_base="$(git rev-parse HEAD)"
          if [[ "$trusted_base" != "$TESTED_BASE_SHA" ]]; then
            echo "Master changed after pull request revalidation" >&2
            exit 1
          fi

          git fetch --no-tags origin "refs/pull/$PR_NUMBER/merge"
          fetched_merge="$(git rev-parse FETCH_HEAD)"
          if [[ "$fetched_merge" != "$TESTED_MERGE_SHA" ]]; then
            echo "Pull request merge candidate changed after testing" >&2
            exit 1
          fi

          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 "$fetched_merge")
          if [[ "$commit" != "$TESTED_MERGE_SHA" || "$first_parent" != "$TESTED_BASE_SHA" || "$second_parent" != "$TESTED_HEAD_SHA" || -n "$extra" ]]; then
            echo "Fetched commit is not the expected two-parent merge candidate" >&2
            exit 1
          fi

          git push origin "$TESTED_MERGE_SHA:refs/heads/master"

          merged_state=""
          merge_commit=""
          for _ in {1..10}; do
            merged_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,mergeCommit)"
            merged_state="$(jq -r '.state' <<<"$merged_json")"
            merge_commit="$(jq -r '.mergeCommit.oid // ""' <<<"$merged_json")"
            if [[ "$merged_state" == 'MERGED' && "$merge_commit" == "$TESTED_MERGE_SHA" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$merged_state" != 'MERGED' || "$merge_commit" != "$TESTED_MERGE_SHA" ]]; then
            echo "GitHub did not record the exact tested merge commit" >&2
            exit 1
          fi

          git fetch --force --tags origin

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          latest_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)

          if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            new_tag="v${major}.$((minor + 1)).0"
          else
            latest_tag="v0.0.0"
            new_tag="v0.1.0"
          fi

          echo "Bumping $latest_tag to $new_tag at $TESTED_MERGE_SHA"
          git tag -a "$new_tag" "$TESTED_MERGE_SHA" -m "Bump minor version for dependency update"
          git push origin "$new_tag"

          # Pushes made with GITHUB_TOKEN do not start another workflow run.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$new_tag"
