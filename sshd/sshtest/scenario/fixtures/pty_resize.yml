# Test PTY resize functionality
name: pty resize
description: Test that PTY resize works correctly

steps:
  - client: test
    actions:
      - connect
      - shell
      - resize:
          cols: 120
          rows: 40
      - line: "echo resized"
    expect:
      - wait_for_output:
          text: "resized"
          timeout: 5s
      - event: pty.resized
